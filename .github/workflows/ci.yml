name: Tests
on:
  pull_request:
    paths: &paths
      - 'src/**'
      - 'tests/**'
      - 'composer.json'
      - 'testo.php'
      - '.github/workflows/ci.yml'
  push:
    branches: [ 'master' ]
    paths: *paths

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testo:
    name: Testo
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 10
      matrix:
        php: [ '8.2', '8.3', '8.4' ]

    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download dependencies
        uses: ramsey/composer-install@v4

      - name: Run tests
        run: vendor/bin/testo

  lowest:
    name: Lowest deps
    runs-on: ubuntu-latest
    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: none

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download dependencies
        with:
          dependency-versions: "lowest"
        uses: ramsey/composer-install@v4

      - name: Run tests
        run: vendor/bin/testo

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.2
          coverage: none

      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download dependencies
        uses: ramsey/composer-install@v4

      - name: Run audit
        run: composer audit
